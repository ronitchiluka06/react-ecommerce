        function ProductsDetails({name,price,discountPrice,img}){
          return (
            <>
              <img src={img} width="150"></img>
              <p>{name}</p>
              
              {discountPrice ? (
                <>
                  <p><del>Price: ${price}</del></p>
                  <p>Discount price: ${discountPrice}</p>
                </>
              ): (
                <p>Price: ${price}</p>
              )}

              
              <button>Add to Cart</button>
            </>
          );
        }

        function App(){
          return (
            <>
              <ProductsDetails
              img = "robot.png"
              name='Cotton Socks'
              price='10.90'
              />

              <ProductsDetails 
              name='Tennis Balls'
              price='6.00'
              discountPrice='3.00'
              />

              <ProductsDetails 
              name='T-Shirt'
              price='7.99'
              />

            </>
          );
        }

        const div =(

          <App />
        );


        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(div);

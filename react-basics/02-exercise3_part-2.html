<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
  </head>
  <body>
    <!--Babel = javascript compiler translate other language into javascript
    when using react we dont use normal javascript , we use enhanced version of javascript called JSX (javascript XML) it is same as javascript but we can write HTML directly in our code -->
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel"> 

      function App(){

        const [inputText,setInputText]=React.useState('');

        function saveInputText(event){
          setInputText(event.target.value);
        }

        function resetInput(){
          setInputText('');
        }

        function exampleInput(){
          setInputText('Alice');
        }

        return (
          <>
            <input 
            onChange={saveInputText} 
            placeholder='Type a name here'
            />
            <button 
            onClick={resetInput}>Reset</button>
            <button
            onClick={exampleInput}>Example</button>

            <p>Hello , {inputText}</p>
          </>
        )
      }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>

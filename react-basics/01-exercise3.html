<!DOCTYPE html>
<html>
  <head>
    <title>Exercise 3</title>
  </head>
  <body>
    <!--Babel = javascript compiler translate other language into javascript
    when using react we dont use normal javascript , we use enhanced version of javascript called JSX (javascript XML) it is same as javascript but we can write HTML directly in our code -->
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel"> 

      function Counter({count,setCount}){
        

        function click(){
          setCount(count + 1);
        }

        

        return (
          <>
          <button
            onClick={click}
          >Clicked {count} {count === 1 ? 'times' : 'times'}
          </button>
          
          </>
        )
      }
      

        function App(){

          const [count, setCount] = React.useState(0);

          function resetValue(){
            setCount(0);
          }

          return (
            <>
              <Counter 
                count = {count}
                setCount = {setCount}
              />
              <Counter 
                count = {count}
                setCount = {setCount}
                />

              <button 
                onClick={resetValue}
                >Reset
              </button>
            </>
          );
        }


        const container = document.querySelector('.js-container');
        ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>

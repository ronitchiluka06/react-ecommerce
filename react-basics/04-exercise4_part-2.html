<!DOCTYPE html>
<html>
  <head>
    <title>Chatbot</title>
    <style>
      .email-input{
        display: block;
        margin-bottom: 10px;
        padding: 10px 15px;
        border-radius: 10px;
      }

      .password-input{
        margin-bottom: 10px;
        padding: 10px 15px;
        border-radius: 10px;
      }

      .show-btn{
        padding: 10px 15px;
        border-radius: 5px;
        border: none;
        color: white;
        background-color: gray;
        margin-left: 10px;
      }
      
      .login-btn{
        background-color: rgb(0, 123, 255);
        padding: 10px 15px;
        border-radius: 5px;
        border: none;
        color: white;
        margin-right: 10px;
      }

      .signup-btn{
        background-color: rgb(0, 123, 255);
        padding: 10px 15px;
        border-radius: 5px;
        border: none;
        color: white;
      }
    </style>
  </head>
  <body>
    <!--Babel = javascript compiler translate other language into javascript
    when using react we dont use normal javascript , we use enhanced version of javascript called JSX (javascript XML) it is same as javascript but we can write HTML directly in our code -->
    <div class="js-container"></div>
    <script src="react-basics.js"></script>
    <script src="https://unpkg.com/supersimpledev/react.js"></script>
    <script src="https://unpkg.com/supersimpledev/react-dom.js"></script>

    <script src="https://unpkg.com/supersimpledev/babel.js"></script>

    <script src="https://unpkg.com/supersimpledev/dayjs.js"></script>
    <script type="text/babel"> 

      function App(){

        const [show , setShow]= React.useState(false);
        const [time , setTime]= React.useState(dayjs().format('HH:mm:ss'));
        const [count , setCount]= React.useState(0);
        const buttonRef = React.useRef();
        const intervalRef = React.useRef(null);
        

        React.useEffect(()=>{
          setInterval(()=>{
            console.log('run code');
            setTime(dayjs().format('HH:mm:ss'))
          },1000);
        },[]);

        function showClicked(){
          setShow(!show);
        }
        
        function increaseCount(){
          setCount(count +1);
        }

        function resetCounter(){
          setCount(0);
          if(intervalRef.current){
            clearInterval(intervalRef.current);
          }
        }

        function autoCounter(){
          if(intervalRef.current){
            return;
          }
          intervalRef.current =setInterval(()=>{
            const buttonElem =buttonRef.current;
            if(buttonElem){
              buttonElem.click();
            }
          },1000);
          
        }



        return (
          <>
          <p>Hello, welcome to my website</p>
          <input className="email-input" placeholder="Email"></input> 
          <div>
          <input type = {show ? "text" : "password"} className="password-input"  placeholder="Password"></input>
          <button className="show-btn" onClick={showClicked}>{show ? "Hide" : "Show"}</button>
          </div>
          <button className="login-btn">Login</button>
          <button className="signup-btn">Sign up</button>
          <p>current time: {time}</p>
          <button onClick={increaseCount} ref={buttonRef}>Clicked {count} time</button>
          <button onClick={resetCounter} >Reset</button>
          <button onClick={autoCounter}>Auto Click</button>
          </>
        )
      }


      const container = document.querySelector('.js-container');
      ReactDOM.createRoot(container).render(<App />);
    </script>
  </body>
</html>
